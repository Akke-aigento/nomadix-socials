<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Kyrgyzstan on the fridge</title>
<link rel="stylesheet" href="../brand.css">
<!-- genre: collage (polaroids op kurk). Foto's + plaatsen + dagen uit media.json. -->
<style>
  body { background:#b88a5a; }
  .cork { position:absolute; inset:0; background:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,.12) 0 2px, transparent 3px) 0 0/17px 19px,
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.12) 0 2px, transparent 3px) 0 0/23px 21px,
      linear-gradient(135deg,#c79a66,#a77746); }
  .pol { position:absolute; background:#fbfaf6; padding:22px 22px 90px; box-shadow: 14px 18px 0 rgba(0,0,0,.25); }
  .pol .img { width:100%; height:100%; background-size:cover; background-position:center; }
  .pol .cap { position:absolute; left:26px; right:26px; bottom:22px; font-family:"Bebas Neue"; font-size:40px; color:#222; letter-spacing:.02em; }
  .pin { position:absolute; width:34px; height:34px; border-radius:50%; background: radial-gradient(circle at 35% 35%, #ffd27a, #F59E0B 55%, #a8650a); box-shadow: 4px 6px 0 rgba(0,0,0,.3); }
  .card { position:absolute; left:var(--pad); bottom:80px; background:#0A0A0A; color:#fff; padding:34px 40px; transform:rotate(-2deg); box-shadow: 14px 18px 0 rgba(0,0,0,.25); }
  .card .display { font-size:84px; }
  .card p { font:500 26px Inter; color:var(--mute); margin-top:8px; }
  .logo { right:70px; bottom:90px; height:44px; }
</style>
</head>
<body>
  <div class="cork"></div>
  <div class="pol" style="left:70px;top:70px;width:470px;height:560px;transform:rotate(-6deg)"><div class="img" style="background-image:url(../media/vx-2022-06-20-kyrgyzstan-0868.jpg)"></div><div class="cap">Issyk Kul · day 80</div></div>
  <div class="pin" style="left:290px;top:66px"></div>
  <div class="pol" style="left:560px;top:110px;width:450px;height:430px;transform:rotate(5deg)"><div class="img" style="background-image:url(../media/vx-2022-06-23-kyrgyzstan-0936.jpg)"></div><div class="cap">Issyk Kul · day 83</div></div>
  <div class="pin" style="left:770px;top:100px"></div>
  <div class="pol" style="left:520px;top:560px;width:470px;height:480px;transform:rotate(-3deg)"><div class="img" style="background-image:url(../media/vx-2022-06-25-kyrgyzstan-0965.jpg)"></div><div class="cap">Issyk Kul · day 85</div></div>
  <div class="pin" style="left:740px;top:556px"></div>
  <div class="pol" style="left:110px;top:640px;width:390px;height:400px;transform:rotate(7deg)"><div class="img" style="background-image:url(../media/vx-2022-06-23-kyrgyzstan-0914.jpg)"></div><div class="cap">Passenger seat view</div></div>
  <div class="pin" style="left:290px;top:640px"></div>
  <div class="card"><div class="display">Kyrgyzstan</div><p>Where a kitten joined the trip.</p></div>
  <img class="logo" src="../logo-white.svg" alt="VanXcel">
</body>
</html>
