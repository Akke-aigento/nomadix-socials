<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="nx-reel" content="1080x1920" data-duration="19" data-fps="30">
<title>Reel: day 1 vs day 88</title>
<link rel="stylesheet" href="../../brand.css">
<!-- Journey, voor/na (nieuw: reel-voor-na), gesplitst scherm op de beat (Open Steppe, 90 BPM: scène = 4 tellen = 2,67 s).
     Drie paren: begin van de reis (dag 1–3) tegenover later (dag 56–88). Plaats en dag uit media.json.
     Dag 88 (Osh, Kirgizië) = laatste Kirgizische foto; Kirgizië was het keerpunt (bible). Nummerplaat + grille-logo vervaagd op dag 1. -->
<style>
  .half { position:absolute; left:0; width:1080px; height:958px; overflow:hidden; background:var(--card); }
  .half.t { top:0; } .half.b { top:962px; }
  .half img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; }
  .divider { position:absolute; left:0; right:0; top:958px; height:4px; background:var(--petrol); z-index:3; }
  .st { position:absolute; left:var(--pad); z-index:4; font-size:30px; text-shadow:0 2px 10px rgba(0,0,0,.7); }
  .st.t { top:850px; } .st.b { top:1010px; }
  .tag { position:absolute; right:var(--pad); z-index:4; font-family:"Bebas Neue",sans-serif; font-size:84px; line-height:1; text-shadow:0 2px 14px rgba(0,0,0,.6); }
  .tag.t { top:812px; } .tag.b { top:1000px; }
  .sh-t { position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,10,10,.55) 0%, rgba(10,10,10,0) 30%, rgba(10,10,10,0) 70%, rgba(10,10,10,.7) 100%); }
  .sh-b { position:absolute; inset:0; background:linear-gradient(0deg, rgba(10,10,10,.6) 0%, rgba(10,10,10,0) 30%, rgba(10,10,10,0) 72%, rgba(10,10,10,.7) 100%); }
  .intro { position:absolute; left:var(--pad); right:var(--pad); top:1180px; z-index:5; }
  .note { position:absolute; left:var(--pad); right:var(--pad); top:1420px; z-index:5; }
  .end { position:absolute; inset:0; background:var(--ink); opacity:0; display:flex; flex-direction:column; justify-content:center; padding:0 var(--pad); gap:36px; z-index:9; }
</style>
</head>
<body>
  <div class="half t">
    <img id="t0" src="../../weeks/2026-11-16/belgium-0003-plate-blurred.jpg" alt="Two travellers leaning on Sandy in Soumagne, Belgium, on day 1" style="object-position:55% 40%">
    <img id="t1" src="../../media/vx-2022-04-03-austria-0012.jpg" alt="Snowy road in Flachau, Austria, seen over the bonnet" style="object-position:50% 55%">
    <img id="t2" src="../../media/vx-2022-04-04-croatia-0027.jpg" alt="Rocky shore and sea at Ražanac, Croatia" style="object-position:50% 60%">
    <div class="sh-t"></div>
  </div>
  <div class="half b">
    <img id="b0" src="../../media/vx-2022-06-28-kyrgyzstan-1041.jpg" alt="Sandy on a mountain ridge near Osh, Kyrgyzstan, a traveller standing on the roof" style="object-position:50% 78%">
    <img id="b1" src="../../media/vx-2022-05-27-kazakhstan-0542.jpg" alt="A straight road through dry hills in Mangystau, Kazakhstan, seen over the bonnet" style="object-position:50% 60%">
    <img id="b2" src="../../media/vx-2022-06-25-kyrgyzstan-0968.jpg" alt="A mountain track between snow walls in the Issyk-Kul region, Kyrgyzstan" style="object-position:50% 60%">
    <div class="sh-b"></div>
  </div>
  <div class="divider"></div>
  <img class="logo" style="top:250px; left:var(--pad); z-index:4; width:170px" src="../../logo-white.svg" alt="VanXcel">
  <div class="stamp st t" id="stt"><span class="dot"></span><span id="pt">Soumagne, Belgium</span></div>
  <div class="tag t" id="tagt">Day 1</div>
  <div class="stamp st b" id="stb"><span class="dot"></span><span id="pb">Osh, Kyrgyzstan</span></div>
  <div class="tag b" id="tagb">Day 88</div>
  <div class="intro" id="intro"><h1 class="display" style="font-size:170px">Day 1<br><span class="petrol">vs day 88.</span></h1></div>
  <div class="note" id="note"><p class="lead" style="text-shadow:0 2px 12px rgba(0,0,0,.7)">The turning point.</p></div>
  <div class="end" id="end">
    <img src="../../logo-white.svg" alt="VanXcel" style="width:300px">
    <h1 class="display" style="font-size:160px">One truck.<br><span class="petrol">88 days apart.</span></h1>
    <p class="lead">Sandy, our 1984 Land Cruiser, wired in Belgium before day 1: 120Ah LiFePO4, 2500W inverter, a solar panel. The whole trip: six months, 17 countries.</p>
    <span class="kicker" style="color:#fff">Our story → link in bio</span>
  </div>
<script>
  const SEG = 240 / 90, PAIR = 2 * SEG, PAIRS = 3, END = PAIRS * PAIR; // 16 s, then end card
  const P = [
    ["Soumagne, Belgium", "Day 1", "Osh, Kyrgyzstan", "Day 88"],
    ["Flachau, Austria", "Day 2", "Mangystau, Kazakhstan", "Day 56"],
    ["Ražanac, Croatia", "Day 3", "Issyk-Kul region, Kyrgyzstan", "Day 85"],
  ];
  const ease = (x) => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);
  window.setT = (t) => {
    const end = document.getElementById("end");
    if (t >= END) { end.style.opacity = ease((t - END) / 0.5); return; }
    end.style.opacity = 0;
    const i = Math.min(PAIRS - 1, Math.floor(t / PAIR)), local = t - i * PAIR;
    for (let k = 0; k < PAIRS; k++) {
      const top = document.getElementById("t" + k), bot = document.getElementById("b" + k);
      top.style.opacity = k === i ? ease(local / 0.3) : 0;
      top.style.transform = `scale(${1.04 + 0.04 * (local / PAIR)})`;
      const r = k === i ? ease((local - SEG) / 0.45) : 0;
      bot.style.opacity = r > 0 ? 1 : 0;
      bot.style.clipPath = `inset(0 0 ${(1 - r) * 100}% 0)`;
      bot.style.transform = `scale(${1.04 + 0.04 * Math.max(0, (local - SEG) / SEG)})`;
    }
    document.getElementById("pt").textContent = P[i][0];
    document.getElementById("tagt").textContent = P[i][1];
    document.getElementById("pb").textContent = P[i][2];
    document.getElementById("tagb").textContent = P[i][3];
    const rb = ease((local - SEG - 0.2) / 0.3);
    document.getElementById("stb").style.opacity = rb;
    document.getElementById("tagb").style.opacity = rb;
    const tin = ease(local / 0.35);
    document.getElementById("stt").style.opacity = tin;
    document.getElementById("tagt").style.opacity = tin;
    document.getElementById("intro").style.opacity = (i === 0 && local < SEG) ? ease(local / 0.3) * Math.min(1, (SEG - local) / 0.25) : 0;
    document.getElementById("note").style.opacity = (i === 0 && local > SEG + 0.4) ? ease((local - SEG - 0.4) / 0.3) : 0;
  };
</script>
</body>
</html>
