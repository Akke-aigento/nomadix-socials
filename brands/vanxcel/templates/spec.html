<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Product spec</title>
<link rel="stylesheet" href="../brand.css">
<!-- spec: één product op zwart (pijler Product). Naam, prijs en specs ALTIJD live uit SellQo
     (products, tenant 54f6b480-…); specs enkel uit de productomschrijving of vanxcel.com.
     Voorraad 0 = niet gebruiken. Productfoto: brands/vanxcel/products/<slug>.png (vrijstaand). -->
</head>
<body>
  <div class="glow" style="width:820px; height:820px; left:130px; top:150px"></div>
  <img class="logo tl" src="../logo-white.svg" alt="VanXcel">
  <div class="kicker" style="position:absolute; top:78px; right:var(--pad)" data-slot="kicker" data-label="Bovenregel" data-max="24">All-in-one power</div>

  <img class="product" src="../products/converter-1500w.png" alt="VanXcel 5-in-1 Converter 1500W" style="left:150px; top:150px; width:780px; height:500px">

  <div style="position:absolute; left:var(--pad); right:var(--pad); bottom:72px; display:flex; flex-direction:column; gap:22px">
    <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:24px">
      <h1 class="display d-m" data-slot="titel" data-label="Productnaam" data-max="32">5-in-1 Converter<br>1500W</h1>
      <div class="price" data-slot="prijs" data-label="Prijs" data-max="8">€475</div>
    </div>
    <div class="specs">
      <div class="spec"><span class="v" data-slot="s1v" data-label="Spec 1 waarde" data-max="10">1500W</span><span class="l" data-slot="s1l" data-label="Spec 1" data-max="48">pure sine wave inverter, 12V to 230V</span></div>
      <div class="spec"><span class="v" data-slot="s2v" data-label="Spec 2 waarde" data-max="10">25A</span><span class="l" data-slot="s2l" data-label="Spec 2" data-max="48">DC-DC charging from your alternator</span></div>
      <div class="spec"><span class="v" data-slot="s3v" data-label="Spec 3 waarde" data-max="10">500Wp</span><span class="l" data-slot="s3l" data-label="Spec 3" data-max="48">MPPT solar input, plus shore power charger</span></div>
    </div>
  </div>
</body>
</html>
