<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="nx-reel" content="1080x1920" data-duration="16.2" data-fps="30">
<title>Reel: three things on the road</title>
<link rel="stylesheet" href="../../brand.css">
<!-- Journey, reel "3 dingen" (nieuw: reel-3-dingen) op de beat (Long Road, 110 BPM: scène = 4 tellen = 2,18 s).
     Drie hoofdstukken, twee clips elk: sheep, snow, water. Land en dag per clip uit media.json; geen clip uit eerdere reels.
     Geen nummerplaten in beeld. -->
<style>
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; }
  video.on { opacity:1; }
  .top { position:absolute; top:250px; left:var(--pad); right:var(--pad); display:flex; justify-content:space-between; align-items:center; }
  .low { position:absolute; left:var(--pad); right:var(--pad); bottom:370px; display:flex; flex-direction:column; gap:18px; }
  .stamp { font-size:30px; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  .num { font-family:"Bebas Neue",sans-serif; font-size:120px; line-height:.8; color:#fff; opacity:.9; text-shadow:0 2px 16px rgba(0,0,0,.4); }
  .word { font-family:"Bebas Neue",sans-serif; font-size:230px; line-height:.82; text-transform:uppercase; text-shadow:0 4px 24px rgba(0,0,0,.45); }
  .intro { position:absolute; left:var(--pad); right:var(--pad); top:440px; }
  .intro h1 { text-shadow:0 4px 24px rgba(0,0,0,.7) !important; }
  .intro .petrol { color:#fff; background:var(--petrol); padding:0 14px; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .end { position:absolute; inset:0; background:var(--ink); opacity:0; display:flex; flex-direction:column; justify-content:center; padding:0 var(--pad); gap:36px; }
  .shade-top { background: linear-gradient(0deg, rgba(10,10,10,0) 65%, rgba(10,10,10,.7) 100%); }
  .shade-bottom { background: linear-gradient(180deg, rgba(10,10,10,0) 45%, rgba(10,10,10,.85) 100%); }
  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
</style>
</head>
<body>
  <video id="v0" src="../../clips/vx-2022-04-21-turkey-0196.mp4" muted preload="auto"></video>
  <video id="v1" src="../../clips/vx-2022-05-12-georgia-0378.mp4" muted preload="auto"></video>
  <video id="v2" src="../../clips/vx-2022-05-12-georgia-0368.mp4" muted preload="auto"></video>
  <video id="v3" src="../../clips/vx-2022-05-12-georgia-0373.mp4" muted preload="auto"></video>
  <video id="v4" src="../../clips/vx-2022-06-23-kyrgyzstan-0934.mp4" muted preload="auto"></video>
  <div class="shade-top"></div>
  <div class="shade-bottom"></div>
  <div class="flash" id="flash"></div>
  <div class="top"><img class="logo" style="position:static" src="../../logo-white.svg" alt="VanXcel"><span class="kicker" style="color:#fff">6 months on the road</span></div>
  <div class="intro" id="intro"><h1 class="display" style="font-size:150px; text-shadow:0 4px 20px rgba(0,0,0,.45)">Three things<br>you share<br><span class="petrol">the road with.</span></h1></div>
  <div class="low">
    <div class="num" id="num">01</div>
    <div class="word" id="word">Sheep</div>
    <div class="stamp"><span class="dot"></span><span id="place">Turkey</span><span class="sep"></span><span id="day">Day 20</span></div>
  </div>
  <div class="end" id="end">
    <img src="../../logo-white.svg" alt="VanXcel" style="width:300px">
    <h1 class="display" style="font-size:170px">Sheep. Snow.<br><span class="petrol">Water.</span></h1>
    <p class="lead">Filmed from the driver's seat of Sandy, our 1984 Land Cruiser. Six months, 17 countries.</p>
    <span class="kicker" style="color:#fff">Our story → link in bio</span>
  </div>
<script>
  // [video, start-in-clip (s), num, word, country, day, speed (optional; 0.7 = slow-motion, enkel de rivier zonder brugdek)]
  const S = [
    ["v0", 1.0, "01", "Sheep", "Turkey", "Day 20"],
    ["v1", 1.0, "01", "Sheep", "Georgia", "Day 41"],
    ["v2", 0.5, "02", "Snow", "Georgia", "Day 41"],
    ["v2", 5.0, "02", "Snow", "Georgia", "Day 41"],
    ["v3", 1.0, "03", "Water", "Georgia", "Day 41"],
    ["v4", 0.0, "03", "Water", "Kyrgyzstan", "Day 83", 0.7],
  ];
  const SEG = 240 / 110, CLIPS = S.length * SEG; // 13.09 s, then end card
  const vids = [...new Set(S.map(s => s[0]))].reduce((o, id) => (o[id] = document.getElementById(id), o), {});
  const ready = Promise.all(Object.values(vids).map(v => v.readyState >= 2 ? 1 : new Promise(r => v.addEventListener("loadeddata", r, { once: true }))));
  function seek(v, t) {
    return new Promise(r => { if (Math.abs(v.currentTime - t) < 0.001) return r(); v.addEventListener("seeked", r, { once: true }); v.currentTime = t; });
  }
  window.setT = async (t) => {
    await ready;
    const end = document.getElementById("end");
    document.getElementById("intro").style.opacity = t < SEG ? Math.min(1, t / 0.25) * Math.min(1, (SEG - t) / 0.3) : 0;
    const local = t % SEG;
    document.getElementById("flash").style.opacity = (t > 0.1 && t < CLIPS + 0.2 && local < 0.12) ? 0.16 * (1 - local / 0.12) : 0;
    if (t >= CLIPS) { end.style.opacity = Math.min(1, (t - CLIPS) / 0.4); return; }
    end.style.opacity = 0;
    const i = Math.min(S.length - 1, Math.floor(t / SEG));
    Object.entries(vids).forEach(([id, x]) => x.classList.toggle("on", id === S[i][0]));
    const w = document.getElementById("word");
    w.textContent = S[i][3]; document.getElementById("num").textContent = S[i][2];
    const first = i === 0 || S[i - 1][3] !== S[i][3];
    const k = first ? Math.min(1, local / 0.25) : 1;
    w.style.transform = `translateY(${(1 - k) * 40}px)`; w.style.opacity = k;
    document.getElementById("place").textContent = S[i][4];
    document.getElementById("day").textContent = S[i][5];
    await seek(vids[S[i][0]], S[i][1] + local * (S[i][6] ?? 1));
  };
</script>
</body>
</html>
