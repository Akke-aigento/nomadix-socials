<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1920">
<title>Poll: how does your leisure battery charge while driving</title>
<link rel="stylesheet" href="../../brand.css">
<!-- Builders: poll-sticker plakken in het lege vak (y ≈ 1210–1550). Donker, met eenvoudig schema (nieuw: poll-schema).
     Geen bewering, enkel een vraag. Opties sticker: "Split-charge relay" / "DC-DC charger" / "It doesn't (yet)". -->
<style>
  .q { font-family:"Bebas Neue",sans-serif; font-size:132px; line-height:.92; text-transform:uppercase; }
  .schema { display:flex; align-items:center; gap:22px; }
  .bat { flex:none; width:250px; height:150px; border:3px solid rgba(255,255,255,.75); border-radius:22px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:24px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; line-height:1.3; position:relative; }
  .bat::before, .bat::after { content:""; position:absolute; top:-16px; width:34px; height:13px; border-radius:4px 4px 0 0; background:rgba(255,255,255,.75); }
  .bat::before { left:40px; } .bat::after { right:40px; }
  .bat.pet { border-color:var(--petrol); } .bat.pet::before, .bat.pet::after { background:var(--petrol); }
  .wire { flex:1; height:4px; background:repeating-linear-gradient(90deg, var(--petrol) 0 18px, transparent 18px 32px); position:relative; }
  .wire span { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:96px; height:96px; border-radius:50%; background:var(--ink); border:3px solid var(--amber); color:var(--amber); font-family:"Bebas Neue",sans-serif; font-size:72px; display:flex; align-items:center; justify-content:center; }
  .box { position:absolute; left:var(--pad); right:var(--pad); top:1210px; height:340px; border:3px dashed rgba(0,136,148,.6); border-radius:32px; }
</style>
</head>
<body>
  <img class="logo" style="top:260px; left:var(--pad)" src="../../logo-white.svg" alt="VanXcel">
  <div style="position:absolute; left:var(--pad); right:var(--pad); top:400px; display:flex; flex-direction:column; gap:44px">
    <div class="kicker" data-slot="reeks" data-label="Reeks" data-max="28">Builders poll</div>
    <h1 class="q" data-slot="titel" data-label="Vraag" data-max="70">Engine running.<br>How does your<br><span class="petrol">leisure battery</span> charge?</h1>
    <div class="schema">
      <div class="bat">Starter<br>battery</div>
      <div class="wire"><span>?</span></div>
      <div class="bat pet">Leisure<br>battery</div>
    </div>
  </div>
  <div class="box"></div>
</body>
</html>
