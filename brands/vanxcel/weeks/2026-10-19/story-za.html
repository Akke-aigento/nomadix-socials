<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1920">
<title>LiFePO4 vs AGM</title>
<link rel="stylesheet" href="../../brand.css">
<!-- Bron: vanxcel.com powerSeo.text2 en faq a4 (Vanxcel-repo en.json). -->
</head>
<body>
  <div class="glow" style="width:900px; height:900px; right:-300px; top:300px"></div>
  <img class="logo" style="top:260px; left:var(--pad)" src="../../logo-white.svg" alt="VanXcel">
  <div style="position:absolute; left:var(--pad); right:var(--pad); top:420px; display:flex; flex-direction:column; gap:40px">
    <div class="kicker" data-slot="reeks" data-label="Reeks" data-max="28">LiFePO4 vs AGM</div>
    <h1 class="display" style="font-size:140px" data-slot="titel" data-label="Titel" data-max="44">Compare<br><span class="petrol">usable</span> Ah,<br>not the label.</h1>
    <div class="specs">
      <div class="spec"><span class="v" data-slot="s1v" data-label="Waarde 1" data-max="10">80–90%</span><span class="l" data-slot="s1l" data-label="Regel 1" data-max="40">usable from a LiFePO4 battery</span></div>
      <div class="spec"><span class="v" data-slot="s2v" data-label="Waarde 2" data-max="10">50%</span><span class="l" data-slot="s2l" data-label="Regel 2" data-max="40">usable from an AGM battery</span></div>
    </div>
    <p class="lead" data-slot="tekst" data-label="Tekst" data-max="130">So 200Ah of LiFePO4 gives you about as much usable energy as 400Ah of AGM, at half the weight.</p>
  </div>
  <div style="position:absolute; left:var(--pad); right:var(--pad); bottom:360px; display:flex; align-items:center; justify-content:space-between">
    <span class="pill petrol" data-slot="cta" data-label="Knop" data-max="34">Size your battery</span>
    <span class="body" style="color:var(--mute)" data-slot="link" data-label="Link" data-max="30">vanxcel.com/calculator</span>
  </div>
</body>
</html>
