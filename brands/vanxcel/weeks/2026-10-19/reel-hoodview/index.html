<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="nx-reel" content="1080x1920" data-duration="18.2" data-fps="30">
<title>Reel: hood view, Turkey to Kyrgyzstan</title>
<link rel="stylesheet" href="../../../brand.css">
<style>
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; }
  video.on { opacity:1; }
  .top { position:absolute; top:250px; left:var(--pad); right:var(--pad); display:flex; justify-content:space-between; align-items:center; }
  .low { position:absolute; left:var(--pad); right:var(--pad); bottom:360px; display:flex; flex-direction:column; gap:22px; }
  .stamp { font-size:30px; }
  .end { position:absolute; inset:0; background:var(--ink); opacity:0; display:flex; flex-direction:column; justify-content:center; padding:0 var(--pad); gap:36px; }
  .shade-top { background: linear-gradient(0deg, rgba(10,10,10,0) 70%, rgba(10,10,10,.75) 100%); }
  .shade-bottom { background: linear-gradient(180deg, rgba(10,10,10,0) 55%, rgba(10,10,10,.8) 100%); }
  .bar { position:absolute; left:var(--pad); right:var(--pad); bottom:330px; height:4px; background:rgba(255,255,255,.18); }
  .bar i { display:block; height:100%; background:var(--petrol); width:0; }
</style>
</head>
<body>
  <video id="v0" src="../../../clips/vx-2022-04-19-turkey-0165.mp4" muted preload="auto"></video>
  <video id="v1" src="../../../clips/vx-2022-05-12-georgia-0343.mp4" muted preload="auto"></video>
  <video id="v2" src="../../../clips/vx-2022-05-12-georgia-0366.mp4" muted preload="auto"></video>
  <video id="v3" src="../../../clips/vx-2022-05-21-azerbaijan-0483.mp4" muted preload="auto"></video>
  <video id="v4" src="../../../clips/vx-2022-05-27-kazakhstan-0521.mp4" muted preload="auto"></video>
  <video id="v5" src="../../../clips/vx-2022-06-13-kazakhstan-0752.mp4" muted preload="auto"></video>
  <video id="v6" src="../../../clips/vx-2022-06-26-kyrgyzstan-0993.mp4" muted preload="auto"></video>
  <div class="shade-top"></div>
  <div class="shade-bottom"></div>
  <div class="top"><img class="logo" style="position:static" src="../../../logo-white.svg" alt="VanXcel"><span class="kicker" style="color:#fff">Hood view</span></div>
  <div class="low">
    <div class="stamp"><span class="dot"></span><span id="place">Turkey</span><span class="sep"></span><span id="day">Day 18</span></div>
    <h1 class="display" style="font-size:120px" id="head">Belgium<br>to Kyrgyzstan.</h1>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="end" id="end">
    <img src="../../../logo-white.svg" alt="VanXcel" style="width:300px">
    <h1 class="display" style="font-size:170px">6 months.<br><span class="petrol">17 countries.</span></h1>
    <p class="lead">One 1984 Land Cruiser and a 120Ah LiFePO4 bank, built in Belgium.</p>
    <span class="kicker" style="color:#fff">Our story → link in bio</span>
  </div>
<script>
  // [video, start-in-clip (s), country, day]
  const S = [
    ["v0", 1.0, "Turkey", "Day 18"],
    ["v1", 1.0, "Georgia", "Day 41"],
    ["v2", 2.0, "Georgia", "Day 41"],
    ["v3", 1.0, "Azerbaijan", "Day 50"],
    ["v4", 1.0, "Kazakhstan", "Day 56"],
    ["v5", 1.0, "Kazakhstan", "Day 73"],
    ["v6", 0.5, "Kyrgyzstan", "Day 86"],
  ];
  const SEG = 2.2, CLIPS = S.length * SEG; // 15.4 s, then end card
  const vids = S.map(s => document.getElementById(s[0]));
  const ready = Promise.all(vids.map(v => v.readyState >= 2 ? 1 : new Promise(r => v.addEventListener("loadeddata", r, { once: true }))));
  function seek(v, t) {
    return new Promise(r => { if (Math.abs(v.currentTime - t) < 0.001) return r(); v.addEventListener("seeked", r, { once: true }); v.currentTime = t; });
  }
  window.setT = async (t) => {
    await ready;
    const end = document.getElementById("end");
    const head = document.getElementById("head");
    head.style.opacity = t < 3.2 ? Math.min(1, t / 0.4) * Math.min(1, (3.2 - t) / 0.4) : 0;
    if (t >= CLIPS) {
      end.style.opacity = Math.min(1, (t - CLIPS) / 0.5);
      return;
    }
    end.style.opacity = 0;
    const i = Math.min(S.length - 1, Math.floor(t / SEG));
    const v = vids[i];
    vids.forEach((x, k) => x.classList.toggle("on", k === i));
    document.getElementById("place").textContent = S[i][2];
    document.getElementById("day").textContent = S[i][3];
    document.getElementById("prog").style.width = (t / CLIPS * 100) + "%";
    await seek(v, S[i][1] + (t - i * SEG));
  };
</script>
</body>
</html>
