  <img class="photo" src="bosnia-0050-plate-blurred.jpg" alt="" style="object-position:62% center">

    <p class="lead" style="font-size:44px; margin-top:28px" data-slot="vraag" data-label="Vraag" data-max="60">Will yours be on the road by summer?</p>
  </div>
