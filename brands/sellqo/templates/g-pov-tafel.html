<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Tafel 7 wil nog 2 pintjes</title>
<link rel="stylesheet" href="../brand.css">
<!-- genre: pov-scène (getekend, bovenaanzicht). Bron: brand-sellqo §8 "Horeca: QR aan tafel, keukenscherm".
     Geen prijzen in beeld: die komen uit de echte menukaart van een winkel, niet verzonnen. -->
<style>
  body { background:#6b3f22; }
  .wood { position:absolute; inset:0;
    background:
      repeating-linear-gradient(92deg, rgba(0,0,0,.10) 0 3px, transparent 3px 46px),
      repeating-linear-gradient(88deg, rgba(255,255,255,.05) 0 2px, transparent 2px 23px),
      linear-gradient(160deg,#8a5530,#5e3519 60%,#4a2913); }
  .ring { position:absolute; border-radius:50%; border:10px solid rgba(40,20,8,.25); }
  .pint { position:absolute; width:250px; height:250px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,.0) 0 78%, rgba(255,255,255,.75) 80%, rgba(255,255,255,.25) 86%, transparent 88%),
      radial-gradient(circle at 35% 35%, rgba(255,255,255,.9) 0 3%, transparent 4%) 0 0/38px 38px,
      radial-gradient(circle at 45% 40%, #fffaf0 0 50%, #f3e4c0 70%, #e6c98a 78%);
    box-shadow: 18px 22px 0 rgba(0,0,0,.25); }
  .pint.half { background: radial-gradient(circle, transparent 0 78%, rgba(255,255,255,.75) 80%, rgba(255,255,255,.25) 86%, transparent 88%),
      radial-gradient(circle at 45% 40%, #f8d76a 0 30%, #e2a520 55%, #f6ead0 64%, #fffaf0 74%, #e6c98a 78%); }
  .mat { position:absolute; width:300px; height:300px; border-radius:50%; background:#f3ead8; box-shadow: 8px 10px 0 rgba(0,0,0,.2); }
  .mat::after { content:""; position:absolute; inset:22px; border-radius:50%; border:6px solid var(--coral); }
  .qr { position:absolute; left:110px; top:860px; width:210px; height:250px; background:#fff; border-radius:18px; transform:rotate(-8deg);
    box-shadow: 10px 14px 0 rgba(0,0,0,.25); padding:22px; font:600 22px Inter; color:var(--navy); text-align:center; }
  .qr .code { width:166px; height:166px; margin:0 auto 12px;
    background:
      conic-gradient(var(--navy) 25%,transparent 0 50%,var(--navy) 0 75%,transparent 0) 0 0/28px 28px,
      conic-gradient(transparent 25%,var(--navy) 0 50%,transparent 0) 7px 11px/22px 34px; }
  .hand { position:absolute; right:-10px; bottom:-60px; width:620px; height:900px; transform:rotate(-14deg); }
  .arm { position:absolute; left:250px; bottom:-200px; width:300px; height:520px; background:#e0a983; border-radius:150px 150px 40px 40px; }
  .phone { position:absolute; left:70px; top:40px; width:470px; height:780px; border-radius:62px; background:#10162e; padding:18px; box-shadow: 24px 30px 0 rgba(0,0,0,.28); }
  .screen { width:100%; height:100%; border-radius:46px; background:#fff; overflow:hidden; display:flex; flex-direction:column; }
  .bar { background:var(--navy); color:#fff; padding:56px 34px 26px; }
  .bar small { display:block; font:600 20px Inter; letter-spacing:.12em; text-transform:uppercase; color:var(--coral); }
  .bar b { font:700 46px Poppins; }
  .item { display:flex; align-items:center; justify-content:space-between; padding:26px 34px; border-bottom:2px solid var(--line); font:600 32px Inter; color:var(--navy); }
  .qty { display:flex; align-items:center; gap:16px; font:700 34px Poppins; }
  .qty i { width:52px; height:52px; border-radius:50%; border:3px solid var(--navy); display:grid; place-items:center; font-style:normal; font-size:30px; }
  .qty i.on { background:var(--coral); border-color:var(--coral); color:#fff; }
  .cta { margin:auto 26px 30px; background:var(--coral); color:#fff; border-radius:24px; padding:28px; text-align:center; font:700 32px Poppins; }
  .thumb { position:absolute; left:20px; top:560px; width:150px; height:260px; background:#e0a983; border-radius:70px; transform:rotate(18deg); box-shadow: inset -12px 0 0 rgba(0,0,0,.08); }
  .fingers { position:absolute; right:-10px; top:300px; width:110px; height:420px; background:#d99c75; border-radius:55px; }
  .title { position:absolute; left:var(--pad); top:90px; width:760px; color:#fff; }
  .title .h { font-size:92px; text-shadow: 0 6px 0 rgba(0,0,0,.25); }
  .title p { margin-top:22px; font:500 32px/1.4 Inter; color:rgba(255,255,255,.92); max-width:560px; }
  .logo { left:var(--pad); bottom:70px; height:56px; }
</style>
</head>
<body>
  <div class="wood"></div>
  <div class="ring" style="left:640px;top:120px;width:230px;height:230px"></div>
  <div class="mat" style="left:120px;top:540px"></div>
  <div class="pint" style="left:145px;top:560px"></div>
  <div class="pint half" style="left:440px;top:470px"></div>
  <div class="qr"><div class="code"></div>Scan &amp; bestel</div>
  <div class="hand">
    <div class="arm"></div>
    <div class="fingers"></div>
    <div class="phone"><div class="screen">
      <div class="bar"><small>Tafel 7</small><b>Nog iets?</b></div>
      <div class="item">Pils <span class="qty"><i>-</i>2<i class="on">+</i></span></div>
      <div class="item" style="color:var(--mute)">Bitterballen <span class="qty"><i>-</i>0<i>+</i></span></div>
      <div class="item" style="color:var(--mute)">Spa rood <span class="qty"><i>-</i>0<i>+</i></span></div>
      <div class="cta">Bestelling plaatsen</div>
    </div></div>
    <div class="thumb"></div>
  </div>
  <div class="title">
    <div class="h" data-slot="titel" data-max="40">Tafel 7 wil nog 2 pintjes.</div>
    <p data-slot="tekst" data-max="90">Niemand hoeft te zwaaien. QR aan tafel, recht op het keukenscherm.</p>
  </div>
  <img class="logo" src="../logo-white.png" alt="SellQo">
</body>
</html>
