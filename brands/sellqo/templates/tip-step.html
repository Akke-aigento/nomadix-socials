<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel Peppol 2/6</title>
<link rel="stylesheet" href="../brand.css">
<!-- tip-carousel (Ondernemerstips). Bron: landing.faq "Wat is Peppol" (MKT-4) + Belgische e-facturatieplicht B2B sinds 1 jan 2026. Geen fiscaal advies. -->
</head>
<body>
<div class="blob soft" style="width:700px;height:700px;right:-260px;top:-200px"></div>
<img class="logo tl" src="../logo-navy.png" alt="SellQo">
<div class="counter">2/6</div>
<div style="position:absolute;left:var(--pad);right:var(--pad);top:260px;display:flex;flex-direction:column;gap:40px">
  <div class="step">1</div>
  <h2 class="h h-l" data-slot="titel" data-label="Titel" data-max="50">Wat is <span class="hl">Peppol</span>?</h2>
  <p class="lead" style="font-size:38px" data-slot="tekst" data-label="Tekst" data-max="200" data-multiline="true">Een netwerk waarlangs facturen rechtstreeks van het ene boekhoudprogramma naar het andere gaan, als gestructureerde data. Geen PDF in een mail.</p>
  <div style="display:flex;align-items:center;gap:20px;margin-top:20px">
  <div class="card" style="position:relative;padding:26px 30px;text-align:center;flex:1"><b style="font-size:28px">Jouw programma</b><div class="sub" style="font-size:22px">factuur als data</div></div>
  <span class="chip dark" style="font-size:24px;padding:14px 22px">Peppol →</span>
  <div class="card" style="position:relative;padding:26px 30px;text-align:center;flex:1"><b style="font-size:28px">Hun programma</b><div class="sub" style="font-size:22px">leest ze meteen in</div></div>
</div>
</div>
<div class="swipe">Swipe <span class="coral" style="font-size:34px">→</span></div>
</body>
</html>
