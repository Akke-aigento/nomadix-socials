<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel Peppol 4/6</title>
<link rel="stylesheet" href="../../brand.css">
<!-- tip-carousel (Ondernemerstips). Bron: landing.faq "Wat is Peppol" (MKT-4) + Belgische e-facturatieplicht B2B sinds 1 jan 2026. Geen fiscaal advies. -->
</head>
<body>
<div class="blob soft" style="width:700px;height:700px;right:-260px;top:-200px"></div>
<img class="logo tl" src="../../logo-navy.png" alt="SellQo">
<div class="counter">4/6</div>
<div style="position:absolute;left:var(--pad);right:var(--pad);top:260px;display:flex;flex-direction:column;gap:40px">
  <div class="step">3</div>
  <h2 class="h h-l" data-slot="titel" data-label="Titel" data-max="50">Een PDF mailen <span class="hl">telt niet meer</span>.</h2>
  <p class="lead" style="font-size:38px" data-slot="tekst" data-label="Tekst" data-max="200" data-multiline="true">Voor een factuur aan een ander Belgisch bedrijf volstaat een PDF als bijlage niet meer. Het moet een e-factuur zijn.</p>
  <div style="display:flex;gap:24px;margin-top:20px">
  <div class="myth" style="flex:1"><div class="tag mute">Vroeger</div><div class="h h-s" style="text-decoration:line-through;text-decoration-color:var(--coral);text-decoration-thickness:6px">factuur.pdf</div><div class="sub" style="font-size:22px;margin-top:10px">als bijlage in een mail</div></div>
  <div class="fact" style="flex:1"><div class="tag coral">Nu (B2B)</div><div class="h h-s">e-factuur</div><div style="font-size:22px;margin-top:10px;opacity:.75">via Peppol</div></div>
</div>
</div>
<div class="swipe">Swipe <span class="coral" style="font-size:34px">→</span></div>
</body>
</html>
