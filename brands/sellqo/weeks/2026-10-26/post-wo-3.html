<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel Peppol 3/6</title>
<link rel="stylesheet" href="../../brand.css">
<!-- tip-carousel (Ondernemerstips). Bron: landing.faq "Wat is Peppol" (MKT-4) + Belgische e-facturatieplicht B2B sinds 1 jan 2026. Geen fiscaal advies. -->
</head>
<body>
<div class="blob soft" style="width:700px;height:700px;right:-260px;top:-200px"></div>
<img class="logo tl" src="../../logo-navy.png" alt="SellQo">
<div class="counter">3/6</div>
<div style="position:absolute;left:var(--pad);right:var(--pad);top:260px;display:flex;flex-direction:column;gap:40px">
  <div class="step">2</div>
  <h2 class="h h-l" data-slot="titel" data-label="Titel" data-max="50">Wie <span class="hl">moet</span>?</h2>
  <p class="lead" style="font-size:38px" data-slot="tekst" data-label="Tekst" data-max="200" data-multiline="true">Sinds 1 januari 2026 moeten Belgische bedrijven hun facturen aan andere Belgische bedrijven via Peppol versturen.</p>
  <div style="display:flex;gap:24px;margin-top:20px">
  <div class="card" style="position:relative;width:260px;padding:0;overflow:hidden;text-align:center"><div style="background:var(--coral);color:#fff;font-family:Poppins;font-weight:600;font-size:26px;padding:14px">januari</div><div class="big" style="font-size:110px;padding:26px 0 8px">1</div><div class="sub" style="padding-bottom:22px">2026</div></div>
  <div class="card" style="position:relative;flex:1"><div class="row"><b>Bedrijf → bedrijf</b><span class="chip new">Peppol</span></div><div class="row"><b>Bedrijf → particulier</b><span class="chip blue">Zoals vroeger</span></div></div>
</div>
</div>
<div class="swipe">Swipe <span class="coral" style="font-size:34px">→</span></div>
</body>
</html>
