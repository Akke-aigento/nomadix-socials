<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel Peppol 6/6</title>
<link rel="stylesheet" href="../../brand.css">
<!-- tip-carousel (Ondernemerstips). Bron: landing.faq "Wat is Peppol" (MKT-4) + Belgische e-facturatieplicht B2B sinds 1 jan 2026. Geen fiscaal advies. -->
</head>
<body class="dark">
<img class="logo tl" src="../../logo-white.png" alt="SellQo">
<div class="counter">6/6</div>
<div class="blob coral" style="width:700px;height:700px;right:-320px;top:-360px;opacity:.9"></div>
<div style="position:absolute;left:var(--pad);right:var(--pad);top:270px;display:flex;flex-direction:column;gap:36px">
  <div class="kicker">In SellQo</div>
  <h2 class="h h-m" data-slot="titel" data-label="Titel" data-max="60">De factuur maakt<br>zichzelf. <span class="hl">B2B gaat via Peppol.</span></h2>
  <div class="card" style="position:relative;margin-top:10px">
    <div class="row"><div><b>Na een betaalde bestelling</b><div class="sub">factuur met btw en OSS</div></div><span class="chip ok">Automatisch</span></div>
    <div class="row"><div><b>B2B-facturen via Peppol</b><div class="sub">met de Odoo-koppeling</div></div><span class="chip dark">Vanaf Pro</span></div>
  </div>
</div>
<div style="position:absolute;left:var(--pad);right:var(--pad);bottom:80px;display:flex;justify-content:space-between;align-items:center">
  <span class="body" data-slot="tekst" data-label="Tekst" data-max="40">14 dagen gratis, zonder kredietkaart</span>
  <span class="pill coral" data-slot="cta" data-label="Knop" data-max="16">sellqo.app</span>
</div>
</body>
</html>
