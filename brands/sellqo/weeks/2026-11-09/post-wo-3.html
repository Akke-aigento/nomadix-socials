<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel OSS 3/6</title>
<link rel="stylesheet" href="../../brand.css">
<!-- tip-carousel (Ondernemerstips, variant groot cijfer). Algemene btw-regels voor afstandsverkopen aan particulieren in de EU sinds 1 juli 2021
     (drempel EUR 10.000 voor alle EU-landen samen, per kalenderjaar; daarboven btw van het land van de klant; OSS = een kwartaalaangifte
     in je eigen land; geen OSS voor B2B). Feitelijk, geen advies: "vraag je boekhouder". Enige SellQo-zin: landing.core.invoices_text
     ("Na een betaalde bestelling maakt SellQo meteen de factuur, met btw en OSS correct berekend"). -->
<style>
  .ex { display:flex; gap:18px; flex-wrap:wrap; }
  .ex .card { position:relative; padding:24px 28px; flex:1; min-width:250px; }
  .ex .card b { font-family:"Poppins",sans-serif; font-weight:700; font-size:40px; display:block; }
  .ex .card .sub { font-size:22px; }
  .no { display:flex; gap:18px; align-items:flex-start; font-size:30px; line-height:1.4; padding:18px 0; border-top:1px solid var(--line); }
  .no:first-child { border-top:0; }
  .no i { flex:none; font-style:normal; width:46px; height:46px; border-radius:50%; background:var(--coral-soft); color:#C9452A; display:grid; place-items:center; font-weight:700; font-size:26px; margin-top:2px; }
</style>
</head>
<body>
<div class="blob soft" style="width:760px;height:760px;left:-300px;bottom:-320px"></div>
<img class="logo tl" src="../../logo-navy.png" alt="SellQo">
<div class="counter">3/6</div>
<div style="position:absolute;left:var(--pad);right:var(--pad);top:270px;display:flex;flex-direction:column;gap:44px">
  <div class="step">2</div>
  <h2 class="h h-l" style="font-size:80px" data-slot="titel" data-label="Titel" data-max="50">Onder <span class="hl">€10.000</span></h2>
  <p class="lead" style="font-size:40px" data-slot="tekst" data-label="Tekst" data-max="200" data-multiline="true">Je rekent gewoon de btw van je eigen land, ook op wat je naar het buitenland stuurt.</p>
  <div class="card" style="position:relative;display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:36px">Klant in Frankrijk</b><div class="sub" style="font-size:24px">winkel in België, onder de drempel</div></div><span class="chip blue" style="font-size:28px;padding:14px 24px">Belgische btw</span></div>
</div>
<div class="swipe">Swipe <span class="coral" style="font-size:34px">→</span></div>
</body>
</html>
