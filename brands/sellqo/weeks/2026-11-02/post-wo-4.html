<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel tickets checklist 4/6</title>
<link rel="stylesheet" href="../../brand.css">
<!-- check-carousel (Ondernemerstips, nieuwe variant: checklist met vinkjes). Tips zijn algemeen; elke zin over SellQo komt uit
     landing.sectors.events (datums, tickettypes, early bird, QR-ticket per mail, nooit overboekt, inchecken met gsm ook voor crew)
     en landing.faq "Wat kost SellQo voor events" (niets per maand, vaste kost per betaald ticket, zonder percentage, gratis tickets kosten niets). -->
<style>
  .chk { display:flex; gap:22px; align-items:flex-start; padding:30px 0; border-top:1px solid var(--line); font-size:36px; line-height:1.35; }
  .chk:first-child { border-top:0; }
  .box { flex:none; width:60px; height:60px; border-radius:14px; border:4px solid var(--navy); display:grid; place-items:center; font-weight:700; font-size:30px; color:#fff; margin-top:2px; }
  .box.on { background:var(--coral); border-color:var(--coral); }
  .big-check { width:120px; height:120px; border-radius:30px; background:var(--coral); color:#fff; display:grid; place-items:center; font-family:Poppins; font-weight:700; font-size:70px; }
</style>
</head>
<body>
<div class="blob soft" style="width:700px;height:700px;right:-280px;top:-220px"></div>
<img class="logo tl" src="../../logo-navy.png" alt="SellQo">
<div class="counter">4/6</div>
<div style="position:absolute;left:var(--pad);right:var(--pad);top:260px;display:flex;flex-direction:column;gap:44px">
  <div class="kicker">Check 3 van 4</div>
  <h2 class="h h-l" style="font-size:80px" data-slot="titel" data-label="Titel" data-max="50">Hoeveel <span class="hl">plaatsen</span>?</h2>
  <p class="lead" style="font-size:38px" data-slot="tekst" data-label="Tekst" data-max="200" data-multiline="true">Leg per datum je maximum vast vóór je verkoopt. Zo verkoop je nooit meer tickets dan er mensen binnen mogen.</p>
  <div class="card" style="position:relative;padding:14px 40px"><div class="chk"><span class="box on">✓</span><span>Maximum per datum bepaald</span></div><div class="chk"><span class="box"></span><span>Plaatsen voor crew en gasten apart gehouden</span></div></div>
  <p class="body mute" style="font-size:28px">Tip: hou rekening met de capaciteit van je zaal of route.</p>
</div>
<div class="swipe">Swipe <span class="coral" style="font-size:34px">→</span></div>
</body>
</html>
