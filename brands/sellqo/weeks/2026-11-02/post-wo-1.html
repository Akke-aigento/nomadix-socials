<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel tickets checklist 1/6</title>
<link rel="stylesheet" href="../../brand.css">
<!-- check-carousel (Ondernemerstips, nieuwe variant: checklist met vinkjes). Tips zijn algemeen; elke zin over SellQo komt uit
     landing.sectors.events (datums, tickettypes, early bird, QR-ticket per mail, nooit overboekt, inchecken met gsm ook voor crew)
     en landing.faq "Wat kost SellQo voor events" (niets per maand, vaste kost per betaald ticket, zonder percentage, gratis tickets kosten niets). -->
<style>
  .chk { display:flex; gap:22px; align-items:flex-start; padding:22px 0; border-top:1px solid var(--line); font-size:30px; line-height:1.35; }
  .chk:first-child { border-top:0; }
  .box { flex:none; width:52px; height:52px; border-radius:14px; border:4px solid var(--navy); display:grid; place-items:center; font-weight:700; font-size:30px; color:#fff; margin-top:2px; }
  .box.on { background:var(--coral); border-color:var(--coral); }
  .big-check { width:120px; height:120px; border-radius:30px; background:var(--coral); color:#fff; display:grid; place-items:center; font-family:Poppins; font-weight:700; font-size:70px; }
</style>
</head>
<body class="dark">
<img class="logo tl" src="../../logo-white.png" alt="SellQo">
<div class="counter">1/6</div>
<div class="blob coral" style="width:620px;height:620px;right:-260px;bottom:-280px"></div>
<div style="position:absolute;left:var(--pad);right:var(--pad);top:300px;display:flex;flex-direction:column;gap:40px">
  <div class="big-check">✓</div>
  <div class="kicker" data-slot="kicker" data-label="Bovenregel" data-max="30">Checklist voor organisatoren</div>
  <h1 class="h h-l" data-slot="titel" data-label="Titel" data-max="60">Je eerste tickets<br>online verkopen?<br><span class="hl">Check deze 4 dingen.</span></h1>
  <p class="lead" style="max-width:760px" data-slot="tekst" data-label="Tekst" data-max="90">Beslis ze vóór de verkoop start. Achteraf aanpassen is altijd lastiger.</p>
</div>
<div class="swipe">Swipe <span class="coral" style="font-size:34px">→</span></div>
</body>
</html>
