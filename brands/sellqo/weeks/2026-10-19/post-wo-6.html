<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel misverstanden overstappen 6/6</title>
<link rel="stylesheet" href="../../brand.css">
<!-- myth-fact carrousel (pijler Ondernemerstips). Bron: landing.faq (overzetten, betaalmethoden, gegevens bij stoppen),
     landing.core.shop_text en landing.hero.trust. Elke "feit"-zin komt letterlijk of bijna letterlijk uit die copy. -->
</head>
<body class="dark">
<img class="logo tl" src="../../logo-white.png" alt="SellQo">
<div class="counter" style="color:#fff;z-index:2">6/6</div>
<div class="blob coral" style="width:640px;height:640px;right:-300px;top:-360px;opacity:.9"></div>
<div style="position:absolute;left:var(--pad);right:var(--pad);top:260px;display:flex;flex-direction:column;gap:36px">
  <div class="kicker">Zelf proberen</div>
  <h2 class="h h-l" data-slot="titel" data-label="Titel" data-max="60">Eerst kijken,<br><span class="hl">dan beslissen.</span></h2>
  <div class="card" style="position:relative;margin-top:10px">
    <div class="row"><div><b>14 dagen gratis</b><div class="sub">zonder kredietkaart</div></div><span class="chip ok">Proef</span></div>
    <div class="row"><div><b>Bewaar deze post</b><div class="sub">voor als je overstapt</div></div><span class="chip new">Opslaan</span></div>
  </div>
</div>
<div style="position:absolute;left:var(--pad);right:var(--pad);bottom:80px;display:flex;justify-content:space-between;align-items:center">
  <span class="body" data-slot="tekst" data-label="Tekst" data-max="40">Link in bio</span>
  <span class="pill coral" data-slot="cta" data-label="Knop" data-max="16">sellqo.app</span>
</div>
