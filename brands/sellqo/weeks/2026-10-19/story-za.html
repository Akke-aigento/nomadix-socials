<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1920">
<title>Story: poll waar gaat je tijd naartoe</title>
<link rel="stylesheet" href="../../brand.css">
<!-- poll-fel (pijler Samen, nieuwe variant van poll-story: koraal, bijna enkel typografie). Geen claim: enkel een vraag.
     Het lege vak is voor de poll-sticker (zelf posten). -->
<style>
  body { background:var(--coral); color:var(--deep); }
  .hl2 { color:#fff; }
</style>
</head>
<body>
  <div class="blob" style="width:900px;height:900px;right:-420px;top:-380px;background:rgba(255,255,255,.14)"></div>
  <div class="story-safe" style="display:flex;flex-direction:column;gap:34px">
    <div style="align-self:flex-start;background:#fff;border-radius:999px;padding:18px 30px"><img src="../../logo-navy.png" alt="SellQo" style="height:52px;width:auto;display:block"></div>
    <div class="kicker" style="color:var(--deep)" data-slot="kicker" data-label="Bovenregel" data-max="24">Eerlijk antwoorden</div>
    <h1 class="h" style="font-size:132px;line-height:.98" data-slot="titel" data-label="Vraag" data-max="40">Waar gaat<br>jouw tijd<br><span class="hl2">naartoe?</span></h1>
    <p class="lead" style="color:var(--deep)" data-slot="tekst" data-label="Tekst" data-max="80">Na sluiting, als de zaak dicht is. Wat vreet het meest?</p>
    <div style="flex:1;border:4px dashed rgba(10,16,51,.35);border-radius:36px;display:grid;place-items:center;min-height:300px">
      <span class="body" style="color:rgba(10,16,51,.6)">poll-sticker hier</span>
    </div>
  </div>
</body>
</html>
