<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel misverstanden overstappen 4/6</title>
<link rel="stylesheet" href="../../brand.css">
<!-- myth-fact carrousel (pijler Ondernemerstips). Bron: landing.faq (overzetten, betaalmethoden, gegevens bij stoppen),
     landing.core.shop_text en landing.hero.trust. Elke "feit"-zin komt letterlijk of bijna letterlijk uit die copy. -->
</head>
<body>
<div class="blob soft" style="width:640px;height:640px;right:-240px;top:-220px"></div>
<img class="logo tl" src="../../logo-navy.png" alt="SellQo">
<div class="counter">4/6</div>
<div style="position:absolute;left:var(--pad);right:var(--pad);top:50%;transform:translateY(-46%);display:flex;flex-direction:column;gap:34px">
  <div class="myth" style="position:relative">
    <div class="tag" style="color:#C9452A;display:flex;align-items:center;gap:14px"><span style="display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--coral-soft);font-size:26px">✕</span>Misverstand 3</div>
    <p class="h" style="font-size:58px;line-height:1.12;color:var(--navy)" data-slot="mythe" data-label="Misverstand" data-max="80">Een nieuwe webshop opzetten duurt weken.</p>
  </div>
  <div class="fact">
    <div class="tag coral" style="display:flex;align-items:center;gap:14px"><span style="display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;font-size:24px">✓</span>Zo zit het</div>
    <p class="lead" style="font-size:42px;line-height:1.36" data-slot="feit" data-label="Feit" data-max="180" data-multiline="true">Je webshop staat meteen online op jouwzaak.sellqo.shop. Je eerste product zet je er binnen enkele minuten op.</p>
  </div>
</div>
<div class="swipe">Swipe <span class="coral" style="font-size:34px">→</span></div>
</body>
</html>
