<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel kostprijs per glas 6/6</title>
<link rel="stylesheet" href="../../brand.css">
<!-- tip-carrousel (Ondernemerstips, mini-gids: rekenvoorbeeld). Bron in SellQo: publieke changelog 2026.16g `vat_portie_1` (kostprijs per portie
     uit een vat of fles: vatprijs, inhoud, portie en verlies; één tik en het is de kostprijs, met meteen je foodcost) en 2026.14x `kaart_food_cost`
     (foodcost = kostprijs tegenover de verkoopprijs zonder btw; boven 35 % kleurt het getal rood). Alle bedragen zijn een rekenvoorbeeld, geen marktprijzen. -->
<style>
  .calc { display:flex; flex-direction:column; gap:0; }
  .calc .row { font-size:34px !important; padding:24px 0 !important; }
  .calc .row b { font-family:Poppins; font-weight:700; }
  .res { background:var(--navy); color:#fff; border-radius:24px; padding:30px 36px; display:flex; justify-content:space-between; align-items:center; font-size:34px; font-weight:600; }
  .res b { font-family:Poppins; font-size:60px; color:var(--coral); }
</style>
</head>
<body class="dark">
<img class="logo tl" src="../../logo-white.png" alt="SellQo">
<div class="counter" style="color:#fff">6/6</div>
<div class="blob coral" style="width:700px;height:700px;right:-320px;top:-360px;opacity:.9"></div>
<div style="position:absolute;left:var(--pad);right:var(--pad);top:250px;display:flex;flex-direction:column;gap:36px">
  <div class="kicker">In SellQo</div>
  <h2 class="h h-m" data-slot="titel" data-label="Titel" data-max="60">Vier velden.<br><span class="hl">Eén tik.</span></h2>
  <div class="card" style="position:relative;margin-top:10px">
    <div class="ttl">Kaart › kostprijs <span class="chip blue">Pils 25 cl</span></div>
    <div class="row"><span>Vatprijs</span><b>€ 80,00</b></div>
    <div class="row"><span>Inhoud</span><b>20 l</b></div>
    <div class="row"><span>Portie</span><b>25 cl</b></div>
    <div class="row"><span>Verlies</span><b>10 %</b></div>
    <div class="row"><div><b>Kostprijs</b><div class="sub">foodcost meteen erbij</div></div><span style="display:flex;gap:12px;align-items:center"><b>€ 1,11</b><span class="chip" style="background:#FDE2DD;color:#C62D1F">37 %</span></span></div>
  </div>
  <p class="body" style="color:#C9CEE6;font-size:26px">Boven 35 % kleurt je foodcost rood.</p>
</div>
<div style="position:absolute;left:var(--pad);right:var(--pad);bottom:80px;display:flex;justify-content:space-between;align-items:center">
  <span class="body" data-slot="tekst" data-label="Tekst" data-max="40">Voor horecazaken</span>
  <span class="pill coral" data-slot="cta" data-label="Knop" data-max="20">sellqo.app/horeca</span>
</div>
</body>
</html>
