<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel kostprijs per glas 4/6</title>
<link rel="stylesheet" href="../../brand.css">
<!-- tip-carrousel (Ondernemerstips, mini-gids: rekenvoorbeeld). Bron in SellQo: publieke changelog 2026.16g `vat_portie_1` (kostprijs per portie
     uit een vat of fles: vatprijs, inhoud, portie en verlies; één tik en het is de kostprijs, met meteen je foodcost) en 2026.14x `kaart_food_cost`
     (foodcost = kostprijs tegenover de verkoopprijs zonder btw; boven 35 % kleurt het getal rood). Alle bedragen zijn een rekenvoorbeeld, geen marktprijzen. -->
<style>
  .calc { display:flex; flex-direction:column; gap:0; }
  .calc .row { font-size:34px !important; padding:24px 0 !important; }
  .calc .row b { font-family:Poppins; font-weight:700; }
  .res { background:var(--navy); color:#fff; border-radius:24px; padding:30px 36px; display:flex; justify-content:space-between; align-items:center; font-size:34px; font-weight:600; }
  .res b { font-family:Poppins; font-size:60px; color:var(--coral); }
</style>
</head>
<body>
<div class="blob soft" style="width:700px;height:700px;right:-260px;top:-200px"></div>
<img class="logo tl" src="../../logo-navy.png" alt="SellQo">
<div class="counter">4/6</div>
<div style="position:absolute;left:var(--pad);right:var(--pad);top:240px;display:flex;flex-direction:column;gap:34px">
  <div class="step">3</div>
  <h2 class="h h-l" style="font-size:76px" data-slot="titel" data-label="Titel" data-max="50">Deel door je <span class="hl">portie</span>.</h2>
  <p class="lead" style="font-size:34px" data-slot="tekst" data-label="Tekst" data-max="200" data-multiline="true">18 liter is 1.800 cl. Met glazen van 25 cl tap je er 72.</p>
  <div class="card calc" style="position:relative;margin-top:6px"><div class="row"><span>1.800 cl ÷ 25 cl</span><b>72 glazen</b></div><div class="row"><span>€ 80 ÷ 72</span><b>€ 1,11</b></div></div><div class="res"><span>Kostprijs per glas</span><b>€ 1,11</b></div>
</div>
<div class="swipe">Swipe <span class="coral" style="font-size:34px">→</span></div>
</body>
</html>
