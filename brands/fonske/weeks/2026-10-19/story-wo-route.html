<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1920">
<title>The route</title>
<link rel="stylesheet" href="../../brand.css">
<!-- Story met link-sticker. Geen cafénamen: die staan nergens publiek. -->
</head>
<body>
  <div class="grain"></div>
  <div class="brandrow" style="top:250px; left:var(--pad)"><img src="../../logo-mark.png" alt=""><span class="wordmark">The Fonske Crawl</span></div>

  <div style="position:absolute; left:var(--pad); right:var(--pad); top:400px">
    <h1 class="display d-xl" data-slot="titel" data-label="Titel" data-max="30">One night.<br><span class="gold">Four bars.</span><br>One finale.</h1>
  </div>

  <div class="rows" style="position:absolute; left:var(--pad); right:var(--pad); top:960px">
    <div class="row"><span class="k">21:00</span><span class="v" data-slot="r1" data-label="Regel 1" data-max="28">The Totem, Ladeuzeplein</span></div>
    <div class="row"><span class="k">Then</span><span class="v" data-slot="r2" data-label="Regel 2" data-max="28">4 bars · a shot at each</span></div>
    <div class="row"><span class="k">Finale</span><span class="v amber" data-slot="r3" data-label="Regel 3" data-max="28">The Oude Markt</span></div>
  </div>
</body>
</html>
