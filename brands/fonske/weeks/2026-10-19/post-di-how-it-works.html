<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>How the crawl works</title>
<link rel="stylesheet" href="../../brand.css">
<!-- Feiten van fonskecrawl.com: Ladeuzeplein 21:00 aan de Totem, 4 cafés ±45 min, shot per stop (alcoholvrij kan), finale Oude Markt, 18+ met ID. -->
</head>
<body>
  <div class="grain"></div>
  <div class="brandrow" style="top:72px; left:var(--pad)"><img src="../../logo-mark.png" alt=""><span class="wordmark">The Fonske Crawl</span></div>

  <div style="position:absolute; left:var(--pad); right:var(--pad); top:190px">
    <h1 class="display d-l" data-slot="titel" data-label="Titel" data-max="34">How the night <span class="gold">goes</span></h1>
  </div>

  <div style="position:absolute; left:var(--pad); right:var(--pad); top:470px; display:flex; flex-direction:column; gap:52px">
    <div class="step"><span class="n">1</span><div><div class="t" data-slot="stap1" data-label="Stap 1" data-max="34">21:00 · Meet at The Totem</div><div class="s" data-slot="stap1-uitleg" data-label="Stap 1 uitleg" data-max="70">The giant bug on the book, Ladeuzeplein.</div></div></div>
    <div class="step"><span class="n">2</span><div><div class="t" data-slot="stap2" data-label="Stap 2" data-max="34">4 bars, a shot at each</div><div class="s" data-slot="stap2-uitleg" data-label="Stap 2 uitleg" data-max="70">About 45 minutes per bar. Alcohol-free on request.</div></div></div>
    <div class="step"><span class="n">3</span><div><div class="t" data-slot="stap3" data-label="Stap 3" data-max="34">Finale on the Oude Markt</div><div class="s" data-slot="stap3-uitleg" data-label="Stap 3 uitleg" data-max="70">The longest bar in Europe. Your host shows the way.</div></div></div>
  </div>

  <div style="position:absolute; left:var(--pad); right:var(--pad); bottom:80px; display:flex; align-items:center; justify-content:space-between">
    <span class="pill amber" data-slot="cta" data-label="Knop" data-max="30">Sat 24 Oct · €19</span>
    <span class="small" data-slot="voet" data-label="Voetnoot" data-max="30">18+ · bring your ID</span>
  </div>
</body>
</html>
