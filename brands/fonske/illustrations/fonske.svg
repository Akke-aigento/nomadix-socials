<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100">
  <!-- Fonske / Fons Sapientiae (1975): student met een open boek die een glas over zijn hoofd giet. Hier: het "studentenidee" van wat er in het glas zit. -->
  <defs>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7A8"/><stop offset="1" stop-color="#C4650F"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#110C08" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- sokkel/fontein -->
    <path d="M220 1040 L780 1040"/>
    <path d="M260 1040 L290 900 L710 900 L740 1040"/>
    <path d="M330 900 L330 850 L670 850 L670 900"/>
    <!-- benen -->
    <path d="M430 850 L450 700"/><path d="M570 850 L545 700"/>
    <path d="M400 850 L460 850"/><path d="M545 850 L610 850"/>
    <!-- lijf -->
    <path d="M440 710 C420 620 430 560 470 520 L540 520 C580 560 585 620 560 710 Z"/>
    <!-- hoofd -->
    <circle cx="500" cy="440" r="70"/>
    <!-- arm met boek -->
    <path d="M455 560 C400 600 370 620 340 610"/>
    <!-- arm omhoog met glas -->
    <path d="M545 550 C610 520 640 420 620 330"/>
  </g>
  <!-- open boek -->
  <g stroke="#110C08" stroke-width="8" stroke-linejoin="round" fill="#F4F1EC">
    <path d="M250 560 L340 590 L340 660 L250 630 Z"/>
    <path d="M340 590 L420 560 L420 630 L340 660 Z"/>
  </g>
  <g stroke="#110C08" stroke-width="4" stroke-linecap="round" opacity=".6">
    <path d="M268 590 L322 607"/><path d="M268 610 L322 627"/><path d="M358 607 L404 590"/><path d="M358 627 L404 610"/>
  </g>
  <!-- glas (gekanteld) met bier dat in het hoofd loopt -->
  <g transform="translate(610 300) rotate(-125)">
    <path d="M-38 -60 L38 -60 L30 60 L-30 60 Z" fill="#F4F1EC" stroke="#110C08" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-34 -20 L34 -20 L30 60 L-30 60 Z" fill="url(#beer)"/>
  </g>
  <path d="M575 318 C545 330 515 345 500 385" stroke="#110C08" stroke-width="34" stroke-linecap="round" fill="none"/>
  <path d="M575 318 C545 330 515 345 500 385" stroke="#E8952A" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M570 322 C548 332 528 344 516 362" stroke="#FFE7A8" stroke-width="6" stroke-linecap="round" fill="none"/>
  <g fill="#F4F1EC" stroke="#110C08" stroke-width="4">
    <circle cx="590" cy="292" r="9"/><circle cx="575" cy="270" r="6"/><circle cx="604" cy="268" r="5"/>
  </g>
  <!-- open hoofd: schuim -->
  <path d="M445 395 C470 370 530 370 555 395 C530 410 470 410 445 395 Z" fill="#FFF6DD" stroke="#110C08" stroke-width="7" stroke-linejoin="round"/>
  <!-- water/schuim-spatten -->
  <g fill="#110C08"><circle cx="420" cy="380" r="6"/><circle cx="400" cy="350" r="4"/><circle cx="585" cy="410" r="5"/></g>
  <!-- golfjes in de fontein -->
  <g stroke="#110C08" stroke-width="5" stroke-linecap="round" fill="none" opacity=".6">
    <path d="M330 960 q20 -14 40 0 t40 0"/><path d="M560 990 q20 -14 40 0 t40 0"/><path d="M440 1000 q20 -14 40 0"/>
  </g>
</svg>
