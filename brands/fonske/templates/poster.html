<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Crawl 24 Oct</title>
<link rel="stylesheet" href="../brand.css">
<!-- Aankondiging volgende crawl. Datum, uur, plek en prijs uit SellQo (event_details 7ae8364e…): 24-10 21:00, Ladeuzeplein, The Totem, early bird €19 tot 23-10, daarna €25. -->
</head>
<body>
  <div class="grain"></div>
  <img class="mark" src="../logo-mark.png" alt="" style="width:250px; right:58px; top:60px; opacity:.95">

  <div style="position:absolute; left:var(--pad); right:var(--pad); top:96px">
    <div class="kicker" data-slot="kicker" data-label="Kicker" data-max="30">Next crawl</div>
    <h1 class="display d-xxl" style="margin-top:22px" data-slot="dag" data-label="Dag" data-max="10">Sat 24</h1>
    <h1 class="display d-xl gold" data-slot="maand" data-label="Maand" data-max="12">October</h1>
  </div>

  <div class="rows" style="position:absolute; left:var(--pad); right:var(--pad); top:640px">
    <div class="row"><span class="k">Start</span><span class="v" data-slot="uur" data-label="Uur" data-max="20">21:00</span></div>
    <div class="row"><span class="k">Meet</span><span class="v" data-slot="plek" data-label="Plek" data-max="30">The Totem · Ladeuzeplein</span></div>
    <div class="row"><span class="k">Night</span><span class="v" data-slot="avond" data-label="Avond" data-max="34">4 bars · 4 shots · Oude Markt</span></div>
  </div>

  <div style="position:absolute; left:var(--pad); right:var(--pad); bottom:80px; display:flex; align-items:center; justify-content:space-between">
    <span class="pill amber" data-slot="prijs" data-label="Prijs" data-max="30">€19 early bird</span>
    <span class="body" style="color:var(--mute)" data-slot="link" data-label="Link" data-max="30">fonskecrawl.com</span>
  </div>
</body>
</html>
