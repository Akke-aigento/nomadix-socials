<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Early bird ends tomorrow</title>
<link rel="stylesheet" href="../brand.css">
<!-- Prijzen uit SellQo: early bird €19 (deadline 23-10 22:00), daarna €25. Geen doorstreepte prijs. -->
</head>
<body>
  <div class="grain"></div>
  <img class="mark" src="../logo-mark.png" alt="" style="width:170px; right:66px; top:60px; opacity:.95">

  <div style="position:absolute; left:var(--pad); right:var(--pad); top:120px">
    <div class="kicker red" data-slot="kicker" data-label="Kicker" data-max="30">Fri 23 Oct · 22:00</div>
    <h1 class="display d-l" style="margin-top:26px" data-slot="titel" data-label="Titel" data-max="30">Early bird<br><span class="gold">ends tomorrow.</span></h1>
  </div>

  <div style="position:absolute; left:var(--pad); right:var(--pad); top:690px">
    <div class="stub">
      <div class="p"><span class="gold" data-slot="prijs" data-label="Prijs" data-max="6">€19</span></div>
      <div class="i">
        <span class="display d-s" data-slot="tot" data-label="Tot wanneer" data-max="30">Until Fri 23 Oct</span>
        <span class="body" data-slot="daarna" data-label="Daarna" data-max="40">Then €25 per ticket.</span>
      </div>
    </div>
    <p class="lead" style="margin-top:56px" data-slot="tekst" data-label="Tekst" data-max="120" data-multiline="true">Sat 24 Oct, 21:00 at The Totem on Ladeuzeplein. 4 bars, a shot at each, finale on the Oude Markt.</p>
  </div>

  <div style="position:absolute; left:var(--pad); right:var(--pad); bottom:80px; display:flex; align-items:center; justify-content:space-between">
    <span class="pill amber" data-slot="cta" data-label="Knop" data-max="30">Tickets · link in bio</span>
    <span class="body" style="color:var(--mute)" data-slot="link" data-label="Link" data-max="30">fonskecrawl.com</span>
  </div>
</body>
</html>
