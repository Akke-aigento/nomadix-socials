<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>404</title>
<link rel="stylesheet" href="../brand.css">
<!-- genre: extreme typografie (fel, afgesneden cijfer). Geen claim, enkel een knipoog + CTA. -->
<style>
  body { background: var(--grad); color:#0F1729; }
  .big { position:absolute; left:-60px; top:120px; font:900 640px/0.8 Inter; letter-spacing:-.08em; color:#0F1729; }
  .err { position:absolute; left:var(--pad); top:80px; font:700 26px "JetBrains Mono"; color:#0F1729; opacity:.75; }
  .msg { position:absolute; left:var(--pad); right:var(--pad); top:760px; font:800 78px/1.02 Inter; letter-spacing:-.03em; }
  .msg span { color:#fff; }
  .btn { position:absolute; left:var(--pad); bottom:110px; display:inline-flex; gap:16px; align-items:center; background:#0F1729; color:#fff; padding:28px 40px; border-radius:999px; font:700 32px Inter; }
  .btn i { font-style:normal; color:var(--teal); }
  .mark { position:absolute; right:var(--pad); bottom:110px; height:80px; }
</style>
</head>
<body>
  <div class="err">// error: page not found</div>
  <div class="big">404</div>
  <div class="msg">Deze pagina bestaat niet.<br><span>Jouw website<br>hopelijk wel.</span></div>
  <div class="btn"><i>→</i> studioakke.com</div>
  <img class="mark" src="../mark.svg" alt="">
</body>
</html>
