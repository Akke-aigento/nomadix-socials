<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Tip</title>
<link rel="stylesheet" href="../brand.css">
<!-- tip: genummerde kaart (pijler Tips). Inhoud enkel uit de teksten van studioakke.com (FAQ, Insights, Mail,
     werkwijze, diensten) of algemeen aanvaarde, controleerbare webkennis. Geen eigen statistieken of percentages verzinnen.
     Onderaan altijd een link naar de juiste pagina. -->
</head>
<body>
  <div class="glow violet" style="width:760px; height:760px; left:-320px; bottom:-260px"></div>
  <div class="glow teal" style="width:560px; height:560px; right:-220px; top:-160px"></div>
  <div class="brand tl"><img src="../mark.svg" alt="">Studio <b>Akke</b></div>
  <div class="num" style="position:absolute; right:56px; top:60px" data-slot="nummer" data-label="Nummer" data-max="2">01</div>

  <div style="position:absolute; left:var(--pad); right:var(--pad); top:400px; display:flex; flex-direction:column; gap:40px">
    <div class="code" data-slot="reeks" data-label="Reeks" data-max="30"><span class="c">//</span> website-tip</div>
    <h1 class="h h-l" data-slot="titel" data-label="Titel" data-max="44">Geen hotmail op<br><span class="grad">je bestelwagen.</span></h1>
    <p class="lead" data-slot="tekst" data-label="Tekst" data-max="170" data-multiline="true">Een mailadres bij je eigen domein, zoals info@jouwzaak.be, past bij je zaak. En goed ingesteld herkennen ontvangers je mail als echt.</p>
  </div>

  <div style="position:absolute; left:var(--pad); right:var(--pad); bottom:72px; display:flex; align-items:center; justify-content:space-between">
    <span class="pill teal" data-slot="cta" data-label="Knop" data-max="30">Mail bij je domein</span>
    <span class="code" style="color:var(--mute)" data-slot="link" data-label="Link" data-max="28">studioakke.com/mail</span>
  </div>
</body>
</html>
