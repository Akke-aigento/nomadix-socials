<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1920">
<title>Story</title>
<link rel="stylesheet" href="../brand.css">
<!-- story: vraag of poll (pijler Ondernemers) of link-story. Tekst binnen .story-safe (boven 250 px, onder 340 px vrij).
     Met sticker (poll, vraag, link): laat het vak .sticker-slot leeg; in SellQo manual + sticker. Zonder sticker: haal het vak weg. -->
</head>
<body>
  <div class="grid"></div>
  <div class="glow teal" style="width:820px; height:820px; right:-320px; top:200px"></div>
  <div class="glow violet" style="width:820px; height:820px; left:-320px; bottom:120px"></div>
  <div class="story-safe" style="display:flex; flex-direction:column; gap:40px">
    <div class="brand" style="position:relative"><img src="../mark.svg" alt="">Studio <b>Akke</b></div>
    <div class="code" data-slot="reeks" data-label="Reeks" data-max="28"><span class="c">//</span> vraag van de week</div>
    <h1 class="h h-l" data-slot="titel" data-label="Vraag" data-max="60">Heeft jouw zaak<br><span class="grad">een website?</span></h1>
    <p class="lead" data-slot="tekst" data-label="Tekst" data-max="90">Eerlijk antwoorden mag. Ik ben benieuwd.</p>
    <div class="sticker-slot" style="height:330px; margin-top:auto">poll-sticker hier</div>
  </div>
</body>
</html>
