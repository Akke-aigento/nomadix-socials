<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="nx-size" content="1080x1920">
<title>Post-its: na het formulier</title><link rel="stylesheet" href="../../brand.css">
<!-- genre: post-it (B), wildcard Studio Akke. Citaat "Ik neem binnen 24 uur contact met je op." staat op studioakke.com na het versturen. -->
<style>
body{background:linear-gradient(160deg,var(--navy),var(--violet))}
.code{position:absolute;left:var(--pad);top:270px}
h1{position:absolute;left:var(--pad);right:var(--pad);top:320px;font:900 84px/1.02 Inter;letter-spacing:-.03em;color:#fff}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mon{position:absolute;left:70px;right:70px;top:690px;height:720px;background:#0b111f;border:22px solid #232c3f;border-radius:30px;box-shadow:0 40px 80px rgba(0,0,0,.45)}
.mon::after{content:"";position:absolute;left:50%;bottom:-120px;width:160px;height:100px;margin-left:-80px;background:#232c3f;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.scr{position:absolute;inset:40px;border-radius:12px;background:repeating-linear-gradient(transparent 0 46px,rgba(255,255,255,.04) 46px 48px)}
.pi{position:absolute;width:330px;height:330px;padding:34px 30px;font:700 34px/1.25 Inter;color:#1b1b1b;box-shadow:6px 10px 18px rgba(0,0,0,.35)}
.pi::before{content:"";position:absolute;left:0;right:0;top:0;height:40px;background:rgba(0,0,0,.06)}
.a{background:#5EEAD4;left:40px;top:-60px;transform:rotate(-6deg)}
.b{background:#fde68a;left:330px;top:180px;transform:rotate(4deg)}
.c{background:#F2456D;color:#fff;right:-30px;top:-20px;transform:rotate(8deg);width:300px;height:300px}
.pi small{display:block;font:500 26px/1.35 Inter;margin-top:12px;opacity:.85}
.logo{position:absolute;left:var(--pad);bottom:120px;height:56px}
</style></head><body>
<div class="code">// tip</div>
<h1 data-slot="titel" data-label="Titel" data-max="44" data-multiline="true">Iemand vult je formulier in. <span>En dan?</span></h1>
<div class="mon"><div class="scr"></div>
<div class="pi a">Formulier binnen.<small>Iemand wacht nu op jou.</small></div>
<div class="pi c">Wacht.<br>Hoe lang?</div>
<div class="pi b">Zeg op je site hoe snel je antwoordt.<small>Op studioakke.com: "Ik neem binnen 24 uur contact met je op."</small></div>
</div>
<img class="logo" src="../../logo-white.svg" alt="Studio Akke">
</body></html>
