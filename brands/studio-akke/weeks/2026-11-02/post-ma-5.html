<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel 5: privacy (licht)</title>
<link rel="stylesheet" href="../../brand.css">
<style>
  .lbl { font-family:"JetBrains Mono",monospace; font-size:28px; font-weight:700; color:var(--teal); letter-spacing:.03em; }
  .t { font-size:96px; font-weight:900; letter-spacing:-.04em; line-height:.98; }
  .x { font-size:34px; line-height:1.42; color:rgba(255,255,255,.82); max-width:880px; }
  .bignum { position:absolute; left:var(--pad); top:150px; font-size:300px; font-weight:900; line-height:.8; letter-spacing:-.06em; color:transparent; -webkit-text-stroke:2px rgba(43,212,189,.45); }
  .chips { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .chips div { background:rgba(29,40,58,.78); border:1px solid var(--line); border-radius:22px; padding:30px 32px; font-size:36px; font-weight:800; letter-spacing:-.02em; display:flex; align-items:center; gap:18px; }
  .chips div i { width:16px; height:16px; border-radius:50%; background:var(--teal); display:block; flex:0 0 16px; }
  .bars { display:flex; flex-direction:column; gap:22px; }
  .bars .r { display:grid; grid-template-columns:260px 1fr; gap:24px; align-items:center; font-size:32px; font-weight:700; }
  .bars .r span { height:26px; border-radius:20px; background:rgba(255,255,255,.08); position:relative; overflow:hidden; display:block; }
  .bars .r span b { position:absolute; inset:0 auto 0 0; background:var(--grad); border-radius:20px; }
  .note { background:rgba(29,40,58,.82); border:1px solid var(--line); border-left:6px solid var(--teal); border-radius:24px; padding:36px 40px; display:flex; flex-direction:column; gap:14px; }
  .note p { font-size:32px; line-height:1.4; color:rgba(255,255,255,.88); }
  .note p b { color:var(--teal-light); }
  .paper .lbl { color:#0D9488; }
  .paper .x { color:#334155; }
  .paper .dots i { background:rgba(15,23,41,.18); } .paper .dots i.on { background:#0D9488; }
  .ck { display:flex; gap:20px; align-items:center; font-size:36px; font-weight:800; color:var(--navy); padding:26px 0; border-top:2px solid rgba(15,23,41,.1); }
  .ck i { width:44px; height:44px; border-radius:50%; background:#0D9488; flex:0 0 44px; display:block; position:relative; }
  .ck i::after { content:""; position:absolute; left:15px; top:8px; width:11px; height:21px; border:solid #fff; border-width:0 5px 5px 0; transform:rotate(45deg); }
</style>
</head>
<body class="paper">
  <img src="../../mark.svg" alt="" style="position:absolute; right:-260px; bottom:-300px; width:640px; height:auto; opacity:.07; filter:brightness(0)">
  <div class="brand tl"><img src="../../mark.svg" alt="">Studio <b>Akke</b></div>
  <div class="code" style="position:absolute; top:84px; right:var(--pad); color:#0D9488;"><span class="c">//</span> 5/6</div>
  <div style="position:absolute; left:var(--pad); right:var(--pad); top:260px; display:flex; flex-direction:column; gap:40px">
    <div class="lbl">// 04 privacy</div>
    <h1 class="t" style="color:var(--navy)" data-slot="titel" data-label="Titel" data-max="40">Geen<br>cookiebanner<br>nodig.</h1>
    <div style="margin-top:10px">
      <div class="ck"><i></i><span data-slot="k1" data-label="Punt 1" data-max="34">Plaatst geen cookies</span></div>
      <div class="ck"><i></i><span data-slot="k2" data-label="Punt 2" data-max="34">Slaat geen IP-adressen op</span></div>
      <div class="ck" style="border-bottom:2px solid rgba(15,23,41,.1)"><i></i><span data-slot="k3" data-label="Punt 3" data-max="34">Gehost in de EU</span></div>
    </div>
  </div>
  <div class="dots"><i></i><i></i><i></i><i></i><i class="on"></i><i></i></div>
</body>
</html>
