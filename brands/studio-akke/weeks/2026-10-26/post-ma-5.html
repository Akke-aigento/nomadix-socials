<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel 5</title>
<link rel="stylesheet" href="../../brand.css">
<style>
  .q { font-size:84px; font-weight:900; letter-spacing:-.035em; line-height:1.0; }
  .big { position:absolute; right:40px; top:120px; font-size:420px; font-weight:900; line-height:.8; letter-spacing:-.06em; color:transparent; -webkit-text-stroke:2px rgba(43,212,189,.35); }
  .ans { background:rgba(29,40,58,.78); border:1px solid var(--line); border-left:6px solid var(--teal); border-radius:24px; padding:42px 46px; display:flex; flex-direction:column; gap:18px; }
  .ans .who { font-family:"JetBrains Mono",monospace; font-size:24px; font-weight:700; color:var(--teal); letter-spacing:.04em; }
  .ans .a { font-size:44px; font-weight:800; letter-spacing:-.02em; line-height:1.15; }
  .ans .x { font-size:30px; line-height:1.42; color:rgba(255,255,255,.8); }
</style>
</head>
<body>
  <div class="glow teal" style="width:700px; height:700px; right:-300px; top:-260px"></div>
  <div class="big">04</div>
  <div class="brand tl"><img src="../../mark.svg" alt="">Studio <b>Akke</b></div>
  <div class="code" style="position:absolute; top:84px; right:var(--pad)"><span class="c">//</span> 5/6</div>
  <div style="position:absolute; left:var(--pad); right:var(--pad); top:400px; display:flex; flex-direction:column; gap:56px">
    <div class="code" style="font-size:28px"><span class="c">//</span> vraag 04</div>
    <h1 class="q" data-slot="vraag" data-label="Vraag" data-max="50">Zit hosting<br>bij de prijs?</h1>
    <div class="ans">
      <div class="who">// bij mij</div>
      <div class="a" data-slot="antwoord" data-label="Antwoord" data-max="50">Ja, in de onderhoudspakketten.</div>
      <div class="x" data-slot="uitleg" data-label="Uitleg" data-max="160">Vanaf €69/maand excl. btw, maandelijks opzegbaar. Zonder onderhoud help ik je hosting opzetten: reken op circa €10–20/maand, afhankelijk van de provider.</div>
    </div>
  </div>
<div class="dots"><i></i><i></i><i></i><i></i><i class="on"></i><i></i></div>
</body>
</html>
