<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1920">
<link rel="stylesheet" href="../../brand.css">
<style>
  .row { display:flex; align-items:center; gap:24px; border-radius:30px; padding:40px 44px; }
  .row .ad { font-family:"JetBrains Mono",monospace; font-size:38px; font-weight:700; }
  .row .t { font-size:28px; margin-top:10px; line-height:1.35; }
  .x { background:rgba(242,69,109,.1); border:1px solid rgba(242,69,109,.4); }
  .v { background:rgba(43,212,189,.12); border:2px solid var(--teal); }
  .ico { flex:0 0 76px; height:76px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:900; }
</style>
</head>
<body>
  <div class="glow violet" style="width:820px; height:820px; left:-320px; top:200px"></div>
  <div class="story-safe" style="display:flex; flex-direction:column; gap:40px">
    <div class="brand" style="position:relative"><img src="../../mark.svg" alt="">Studio <b>Akke</b></div>
    <h1 class="h" style="font-size:104px" data-slot="titel" data-label="Titel" data-max="40">Welke mail<br><span class="grad">stuur jij?</span></h1>
    <div class="row x"><div class="ico" style="background:rgba(242,69,109,.2); color:var(--coral)">×</div><div><div class="ad coral" data-slot="links" data-label="Links" data-max="26">jouwzaak@hotmail.com</div><div class="t mute" data-slot="lt" data-label="Uitleg links" data-max="60">Past niet bij je zaak.</div></div></div>
    <div class="row v"><div class="ico" style="background:rgba(43,212,189,.2); color:var(--teal)">✓</div><div><div class="ad teal" data-slot="rechts" data-label="Rechts" data-max="26">info@jouwzaak.be</div><div class="t" data-slot="rt" data-label="Uitleg rechts" data-max="70">Herkenbaar, en goed ingesteld zodat ontvangers je mail als echt herkennen.</div></div></div>
    <div style="margin-top:auto; display:flex; justify-content:space-between; align-items:baseline"><span style="font-size:36px; font-weight:800" data-slot="prijs" data-label="Prijs" data-max="30">Vanaf €10/maand</span><span class="vat">excl. btw</span></div>
    <div class="code" style="font-size:30px; color:var(--white)">studioakke.com/mail</div>
  </div>
</body>
</html>
