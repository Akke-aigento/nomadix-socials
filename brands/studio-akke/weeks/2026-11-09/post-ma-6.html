<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel 6: levertijd en CTA</title>
<link rel="stylesheet" href="../../brand.css">
<style>
  .lbl { font-family:"JetBrains Mono",monospace; font-size:28px; font-weight:700; color:var(--teal); letter-spacing:.03em; }
  .t { font-size:96px; font-weight:900; letter-spacing:-.04em; line-height:.98; }
  .x { font-size:34px; line-height:1.42; color:rgba(255,255,255,.82); max-width:880px; }
  .frames { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .frames div { aspect-ratio:1/1; border-radius:20px; border:2px solid rgba(255,255,255,.16); background:rgba(29,40,58,.6); display:flex; flex-direction:column; justify-content:flex-end; padding:18px; font-family:"JetBrains Mono",monospace; font-size:21px; color:var(--mute); position:relative; overflow:hidden; }
  .frames div::before { content:""; position:absolute; left:50%; top:42%; width:38%; height:38%; transform:translate(-50%,-50%) rotate(var(--r,0deg)); border-radius:14px; background:linear-gradient(150deg, rgba(94,234,212,.55), rgba(56,189,248,.35)); }
  .frames div.s { border-color:var(--teal); background:rgba(43,212,189,.12); color:var(--teal-light); }
  .frames div.s::before { width:70%; height:30%; top:55%; border-radius:10px; background:linear-gradient(90deg, rgba(124,58,237,.5), rgba(43,212,189,.5)); }
</style>
</head>
<body>
  <div class="brand tl"><img src="../../mark.svg" alt="">Studio <b>Akke</b></div>
  <div class="grid"></div>
  <div class="glow teal" style="width:900px; height:900px; right:-360px; top:200px"></div>
  <div style="position:absolute; left:var(--pad); right:var(--pad); top:230px; display:flex; flex-direction:column; gap:36px">
    <div class="lbl">// 05 levertijd</div>
    <h1 class="t" style="font-size:104px" data-slot="titel" data-label="Titel" data-max="40">5 tot 7<br><span class="grad">werkdagen.</span></h1>
    <p class="x" data-slot="tekst" data-label="Tekst" data-max="110">Gerekend vanaf het moment dat je producten bij mij binnen zijn. Daarna stuur ik alles netjes terug.</p>
  </div>
  <div class="card" style="position:absolute; left:var(--pad); right:var(--pad); top:830px; display:flex; flex-direction:column; gap:22px">
    <div style="font-size:42px; font-weight:900; letter-spacing:-.02em" data-slot="cta" data-label="Oproep" data-max="40">Offerte op maat?</div>
    <div class="body" data-slot="cta2" data-label="Uitleg" data-max="80">Vertel me hoeveel producten je hebt. Link in bio.</div>
    <div class="code" style="font-size:28px; font-weight:700" data-slot="link" data-label="Link" data-max="40">studioakke.com/diensten/fotografie</div>
  </div>
  <div class="code" style="position:absolute; top:84px; right:var(--pad);"><span class="c">//</span> 6/6</div>
  <div class="dots"><i></i><i></i><i></i><i></i><i></i><i class="on"></i></div>
</body>
</html>
