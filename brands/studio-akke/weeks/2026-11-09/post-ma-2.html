<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel 2: wat je krijgt</title>
<link rel="stylesheet" href="../../brand.css">
<style>
  .lbl { font-family:"JetBrains Mono",monospace; font-size:28px; font-weight:700; color:var(--teal); letter-spacing:.03em; }
  .t { font-size:96px; font-weight:900; letter-spacing:-.04em; line-height:.98; }
  .x { font-size:34px; line-height:1.42; color:rgba(255,255,255,.82); max-width:880px; }
  .checks li { font-size:36px; } .checks { gap:30px; }
  .frames { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .frames div { aspect-ratio:1/1; border-radius:20px; border:2px solid rgba(255,255,255,.16); background:rgba(29,40,58,.6); display:flex; flex-direction:column; justify-content:flex-end; padding:18px; font-family:"JetBrains Mono",monospace; font-size:21px; color:var(--mute); position:relative; overflow:hidden; }
  .frames div::before { content:""; position:absolute; left:50%; top:42%; width:38%; height:38%; transform:translate(-50%,-50%) rotate(var(--r,0deg)); border-radius:14px; background:linear-gradient(150deg, rgba(94,234,212,.55), rgba(56,189,248,.35)); }
  .frames div.s { border-color:var(--teal); background:rgba(43,212,189,.12); color:var(--teal-light); }
  .frames div.s::before { width:70%; height:30%; top:55%; border-radius:10px; background:linear-gradient(90deg, rgba(124,58,237,.5), rgba(43,212,189,.5)); }
</style>
</head>
<body>
  <div class="brand tl"><img src="../../mark.svg" alt="">Studio <b>Akke</b></div>
  <div class="glow teal" style="width:760px; height:760px; right:-340px; bottom:-280px"></div>
  <div style="position:absolute; left:var(--pad); right:var(--pad); top:220px; display:flex; flex-direction:column; gap:34px">
    <div class="lbl">// 01 wat je krijgt</div>
    <div style="display:flex; align-items:flex-end; gap:34px">
      <div style="font-size:250px; font-weight:900; line-height:.8; letter-spacing:-.06em; color:transparent; -webkit-text-stroke:2px rgba(43,212,189,.6)">6+2</div>
    </div>
    <h1 class="t" style="font-size:84px" data-slot="titel" data-label="Titel" data-max="50">Zes hoeken.<br><span class="grad">Twee sfeerbeelden.</span></h1>
  </div>
  <div class="card" style="position:absolute; left:var(--pad); right:var(--pad); top:860px; padding:50px 50px">
    <ul class="checks">
      <li data-slot="p1" data-label="Punt 1" data-max="50">Witte achtergrond standaard</li>
      <li data-slot="p2" data-label="Punt 2" data-max="50">Nabewerking en retouche</li>
      <li data-slot="p3" data-label="Punt 3" data-max="50">Hoge resolutie, voor web en print</li>
    </ul>
  </div>
  <div class="code" style="position:absolute; top:84px; right:var(--pad);"><span class="c">//</span> 2/6</div>
  <div class="dots"><i></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
