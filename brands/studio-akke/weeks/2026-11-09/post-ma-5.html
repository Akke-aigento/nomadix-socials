<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="nx-size" content="1080x1350">
<title>Carrousel 5: rekenvoorbeeld (fel)</title>
<link rel="stylesheet" href="../../brand.css">
<style>
  .lbl { font-family:"JetBrains Mono",monospace; font-size:28px; font-weight:700; color:var(--teal); letter-spacing:.03em; }
  .t { font-size:96px; font-weight:900; letter-spacing:-.04em; line-height:.98; }
  .x { font-size:34px; line-height:1.42; color:rgba(255,255,255,.82); max-width:880px; }
  .frames { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  .frames div { aspect-ratio:1/1; border-radius:20px; border:2px solid rgba(255,255,255,.16); background:rgba(29,40,58,.6); display:flex; flex-direction:column; justify-content:flex-end; padding:18px; font-family:"JetBrains Mono",monospace; font-size:21px; color:var(--mute); position:relative; overflow:hidden; }
  .frames div::before { content:""; position:absolute; left:50%; top:42%; width:38%; height:38%; transform:translate(-50%,-50%) rotate(var(--r,0deg)); border-radius:14px; background:linear-gradient(150deg, rgba(94,234,212,.55), rgba(56,189,248,.35)); }
  .frames div.s { border-color:var(--teal); background:rgba(43,212,189,.12); color:var(--teal-light); }
  .frames div.s::before { width:70%; height:30%; top:55%; border-radius:10px; background:linear-gradient(90deg, rgba(124,58,237,.5), rgba(43,212,189,.5)); }

  .sum { font-size:84px; font-weight:900; letter-spacing:-.035em; line-height:1; }
  .out { align-self:flex-start; background:var(--navy); color:#fff; font-size:44px; font-weight:800; letter-spacing:-.02em; padding:24px 36px; border-radius:22px; }
  .dots i { background:rgba(15,23,41,.22); } .dots i.on { background:var(--navy); }
  .code, .code .c { color:var(--navy) !important; }</style>
</head>
<body style="background:linear-gradient(150deg,#5EEAD4 0%,#22D3EE 55%,#38BDF8 100%); color:var(--navy)">
  <div class="brand tl" style="color:var(--navy)"><img src="../../mark.svg" alt="" style="filter:brightness(0) opacity(.85)">Studio <b style="color:var(--navy)">Akke</b></div>
  <img src="../../mark.svg" alt="" style="position:absolute; right:-160px; bottom:-140px; width:680px; height:auto; opacity:.15; filter:brightness(0)">
  <div style="position:absolute; left:var(--pad); right:var(--pad); top:240px; display:flex; flex-direction:column; gap:40px; color:var(--navy)">
    <div class="lbl" style="color:var(--navy); opacity:.75">// 04 rekenvoorbeeld</div>
    <div class="sum"><span data-slot="som" data-label="Som" data-max="30">5 producten &times; €95</span></div>
    <div style="height:4px; background:var(--navy); opacity:.8; border-radius:4px; width:100%"></div>
    <div style="display:flex; align-items:baseline; gap:24px"><span style="font-size:190px; font-weight:900; letter-spacing:-.06em; line-height:.85" data-slot="totaal" data-label="Totaal" data-max="10">€475</span><span style="font-size:32px; font-weight:700; opacity:.75">excl. btw</span></div>
    <div class="out"><span style="font-family:'JetBrains Mono',monospace">&rarr;</span> <span data-slot="foto" data-label="Resultaat" data-max="30">40 foto's in totaal</span></div>
  </div>
  <div class="code" style="position:absolute; top:84px; right:var(--pad);"><span class="c">//</span> 5/6</div>
  <div class="dots"><i></i><i></i><i></i><i></i><i class="on"></i><i></i></div>
</body>
</html>
